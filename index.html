<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | </title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="logo">
      <span class="logo-mark"></span>
     
    </div>

    <h1>Entrar na sua conta</h1>
    <p class="lead">Use seu e-mail e sua senha para continuar.</p>


    <form>
      <label for="email">E-mail</label>
      <input id="email" type="email" placeholder="nome@exemplo.com" autocomplete="username">

      <label for="senha">Senha</label>
      <input id="senha" type="password" placeholder="Digite sua senha" autocomplete="current-password">

      <div class="options">
        <label class="check">
          <input type="checkbox">
          Manter conectado
        </label>
        <a href="#">Esqueci minha senha</a>
      </div>

      <button type="button">Entrar</button>
    </form>

    <p class="signup">Ainda não tem conta? <a href="#">Criar conta</a></p>
  </main>
</body>
</html>
